
services:
  bakerypos.api:
    image: ${DOCKER_REGISTRY-}bakeryposapi
    build:
      context: .
      dockerfile: BakeryPOS.API/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=your_dev_cert_password # Replace with a password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ~/.aspnet/https:/https/

  db:
    image: "mcr.microsoft.com/mssql/server:2019-latest"
    environment:
      SA_PASSWORD: "Your_STRONG_Password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"